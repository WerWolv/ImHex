name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'master'
      - 'releases/**'
      - 'tests/**'
      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:

  ci-gate:
    name: 🛡️ Gatekeep CI
    if: >-
      ${{
        !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'WerWolvTranslationBot')
      }}
    runs-on: ubuntu-26.04
    steps:
      - run: echo "Running CI"

  windows:
    name: 🪟 Windows
    needs: ci-gate
    uses: ./.github/workflows/build_windows.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  macos:
    name: 🍎 macOS
    needs: ci-gate
    uses: ./.github/workflows/build_macos.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  appimage:
    name: ⬇️ AppImage
    needs: ci-gate
    uses: ./.github/workflows/build_appimage.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  archlinux:
    name: 🐧 ArchLinux
    needs: ci-gate
    uses: ./.github/workflows/build_archlinux.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  snap:
    name: 🐧 Snap
    needs: ci-gate
    uses: ./.github/workflows/build_snap.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  flatpak:
    name: 🐧 Flatpak
    needs: ci-gate
    uses: ./.github/workflows/build_flatpak.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  wasm:
    name: 🌍 WebAssembly
    needs: ci-gate
    uses: ./.github/workflows/build_wasm.yml
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
      packages: write
