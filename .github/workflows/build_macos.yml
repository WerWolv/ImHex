name: Build macOS

on:
  workflow_call:

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  # MacOS build
  macos-x86:
    runs-on: macos-15-intel

    permissions:
      id-token: write
      attestations: write

    name: 🍎 macOS 10.15 x86_64

    steps:
    - name: 🧰 Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: 📜 Set version variable
      run: |
        echo "IMHEX_VERSION=`cat VERSION`" >> $GITHUB_ENV

    - name: 🧹 Remove unused Homebrew tap
      run: brew untap --force aws/tap || true

    - name: 📜 Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        key: ${{ runner.os }}-ccache-${{ github.run_id }}
        restore-keys: ${{ runner.os }}-ccache
        max-size: 1G
        save: ${{ github.event_name != 'pull_request' }}

    - name: Set Xcode version
      run: |
        sudo xcode-select --install || true
        sudo xcode-select -s /Library/Developer/CommandLineTools

    - name: 📦 Install MacPorts
      run: |
        time wget https://github.com/macports/macports-base/releases/download/v2.11.6/MacPorts-2.11.6-15-Sequoia.pkg
        time sudo installer -pkg MacPorts-2.11.6-15-Sequoia.pkg -target /
        export PATH=/opt/local/bin:/opt/local/sbin:$PATH
        echo "PATH=/opt/local/bin:/opt/local/sbin:$PATH" >> $GITHUB_ENV
        echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> $GITHUB_ENV
        echo "universal_target  10.15" | sudo tee -a /opt/local/etc/macports/macports.conf
        echo "macos_deployment_target  10.15" | sudo tee -a /opt/local/etc/macports/macports.conf
        echo "macosx_sdk_version  10.15" | sudo tee -a /opt/local/etc/macports/macports.conf
        time sudo port selfupdate

    - name: ⬇️ Install dependencies
      env:
        # Make brew not display useless errors
        HOMEBREW_TESTS: 1
      run: |
        brew install llvm automake
        sudo -E port install mbedtls3 nlohmann-json ccache freetype libmagic pkgconfig curl ninja zlib xz bzip2 zstd libssh2 md4c

    - name: ⬇️ Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.100'

    # MacOS cmake build
    - name: 🛠️ Configure CMake
      run: |
        set -x
        mkdir -p build
        cd build
        CC=$(brew --prefix llvm)/bin/clang                                                          \
        CXX=$(brew --prefix llvm)/bin/clang++                                                       \
        OBJC=$(brew --prefix llvm)/bin/clang                                                        \
        OBJCXX=$(brew --prefix llvm)/bin/clang++                                                    \
        cmake -G "Ninja"                                                                            \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15                                                       \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}                                                  \
          -DIMHEX_GENERATE_PACKAGE=ON                                                               \
          -DIMHEX_SYSTEM_LIBRARY_PATH="$(brew --prefix llvm)/lib;$(brew --prefix llvm)/lib/unwind;$(brew --prefix llvm)/lib/c++;$(brew --prefix)/lib" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache                                                        \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache                                                      \
          -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache                                                     \
          -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache                                                   \
          -DCMAKE_INSTALL_PREFIX="./install"                                                        \
          -DIMHEX_PATTERNS_PULL_MASTER=ON                                                           \
          -DIMHEX_COMMIT_HASH_LONG="${GITHUB_SHA}"                                                  \
          -DIMHEX_COMMIT_BRANCH="${GITHUB_REF##*/}"                                                 \
          ..

    - name: 🛠️ Build
      run: cd build && ninja install

    - name: ✒️ Fix Signature
      run: |
        set -x
        cd build/install
        codesign --remove-signature ImHex.app
        codesign --force --deep --sign - ImHex.app

    - name: 📁 Fix permissions
      run: |
        set -x
        cd build/install
        chmod -R 755 ImHex.app/

    - name: 🔫 Kill XProtect
      run: |
        # See https://github.com/actions/runner-images/issues/7522
        echo Killing XProtect...; sudo pkill -9 XProtect >/dev/null || true;
        echo Waiting for XProtect process...; while pgrep XProtect; do sleep 3; done;

    - name: 📦 Create DMG
      run: |
        brew install graphicsmagick imagemagick
        git clone https://github.com/sindresorhus/create-dmg
        cd create-dmg
        npm i && npm -g i
        cd ../build/install
        for i in $(seq 1 10); do
          create-dmg ImHex.app || true
          if ls -d *.dmg 1>/dev/null 2>/dev/null; then
            break;
          fi
        done
        mv *.dmg ../../imhex-${{ env.IMHEX_VERSION }}-macOS-x86_64.dmg

    - name: 🗝️ Generate build provenance attestations
      uses: actions/attest-build-provenance@v4
      if: ${{ github.event.repository.fork == false && github.event_name != 'pull_request' }}
      with:
        subject-path: |
          ./*.dmg

    - name: ⬆️ Upload DMG
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: error
        name: macOS DMG x86_64
        path: ./*.dmg

  macos-arm64:
    runs-on: ubuntu-26.04
    name: 🍎 macOS 11 arm64
    permissions:
      contents: read

    outputs:
      IMHEX_VERSION: ${{ steps.build.outputs.IMHEX_VERSION }}

    steps:
    - name: 🧰 Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: 📁 Restore docker /cache
      uses: ./.github/actions/cache
      with:
        path: cache
        key: macos-arm64-build-cache-${{ github.run_id }}
        restore-keys: macos-arm64-build-cache-

    - name: 📁 Restore macOS SDK
      uses: ./.github/actions/cache
      with:
        path: build-macos-sdk-cache/*.sdk.tar.xz
        key: macos-arm64-sdk

    - name: 🐳 Inject /cache into docker
      uses: reproducible-containers/buildkit-cache-dance@v3
      with:
        cache-map: |
          {
            "cache": "/cache",
            "build-macos-sdk-cache": "/macos-sdk-cache"
          }

    - name: 🛠️ Build using docker
      id: build
      run: |
        echo "IMHEX_VERSION=`cat VERSION`" >> $GITHUB_OUTPUT
        docker buildx build . -f dist/macOS/arm64.Dockerfile --progress=plain --build-arg 'JOBS=4' --build-arg "BUILD_TYPE=$(BUILD_TYPE)" --build-context imhex=$(pwd) --output out
        cp resources/dist/macos/Entitlements.plist out/Entitlements.plist

    - name: ⬆️ Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: macos_arm64_intermediate
        path: out/

  macos-arm64-package:
    runs-on: macos-15-intel
    name: 🍎 macOS 11 arm64 Packaging
    needs: macos-arm64

    env:
      IMHEX_VERSION: ${{ needs.macos-arm64.outputs.IMHEX_VERSION }}

    permissions:
      id-token: write
      attestations: write

    steps:
      - name: 🧹 Remove unused Homebrew tap
        run: brew untap --force aws/tap || true

      - name: ⬇️ Download artifact
        uses: actions/download-artifact@v8
        with:
          name: macos_arm64_intermediate
          path: out

      - name: 🗑️ Delete artifact
        uses: geekyeggo/delete-artifact@v6
        with:
          name: macos_arm64_intermediate

      - name: ✒️ Fix Signature
        run: |
          set -x
          cd out
          codesign --remove-signature ImHex.app
          codesign --force --deep --entitlements Entitlements.plist --sign - ImHex.app

      - name: 📁 Fix permissions
        run: |
          set -x
          cd out
          chmod -R 755 ImHex.app/

      - name: 🔫 Kill XProtect
        run: |
          # See https://github.com/actions/runner-images/issues/7522
          echo Killing XProtect...; sudo pkill -9 XProtect >/dev/null || true;
          echo Waiting for XProtect process...; while pgrep XProtect; do sleep 3; done;

      - name: 📦 Create DMG
        run: |
          brew install graphicsmagick imagemagick
          git clone https://github.com/sindresorhus/create-dmg
          cd create-dmg
          npm i && npm -g i
          cd ../out
          for i in $(seq 1 10); do
            create-dmg ImHex.app || true
            if ls -d *.dmg 1>/dev/null 2>/dev/null; then
              break;
            fi
          done
          mv *.dmg ../imhex-${{ env.IMHEX_VERSION }}-macOS${{ matrix.file_suffix }}-arm64.dmg

      - name: 🗝️ Generate build provenance attestations
        uses: actions/attest-build-provenance@v4
        if: ${{ github.event.repository.fork == false && github.event_name != 'pull_request' }}
        with:
          subject-path: |
            ./*.dmg

      - name: ⬆️ Upload DMG
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: macOS DMG arm64
          path: ./*.dmg
