    #  with:
    #    fail_ci_if_error: true
    #    token: ${{ secrets.CODECOV_TOKEN }}
    #    file: build/coverage_report.xml

  langs:
    name: 🧪 Langs
    runs-on: ubuntu-26.04

    steps:
    - name: 🧰 Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Check langs
      run: |
        python3 dist/langtool.py remove-unused
        python3 dist/langtool.py sync-sublangs
        python3 dist/langtool.py check-nonexistent
        git diff --exit-code
